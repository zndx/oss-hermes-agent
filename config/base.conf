# hermes (signals peer) configuration — single source of truth (house standard).
#
# Env vars enter ONLY via ${?VAR} capture below; application code reads
# hsengine.config.load_config(), never os.environ.
#
# Lattice claims on the shared host:
#   gRPC:  gaius 50051 · aegir 50151 · atelier 50251 · synth 50351
#          · metabase 50451 · signals 50551 · hermes 50651

hermes {
  version = "0.1.0"

  engine {
    grpc {
      host = "127.0.0.1"
      host = ${?HERMES_GRPC_HOST}
      port = 50651
      port = ${?HERMES_GRPC_PORT}
    }

    # Federated Complete: forward capabilities to peer engines. Routes are
    # PLANNED from each peer's Engine/Status — a peer is used only for the
    # capabilities it advertises. Never expose peer vLLM ports (peers own GPUs).
    federation {
      peers = [
        "127.0.0.1:50051",  # gaius  (thinking)
        "127.0.0.1:50151",  # aegir  (instruct)
      ]
      peers = ${?HSENGINE_FEDERATION_PEERS}
      timeout_s = 1200
      timeout_s = ${?HSENGINE_COMPLETE_TIMEOUT_S}
      # Product capability -> peer capabilities accepted for it, best first.
      capability_map {
        agent    = ["thinking", "instruct"]
        instruct = ["thinking", "instruct"]
      }
      status_ttl_s = 5
      status_ttl_s = ${?HSENGINE_STATUS_TTL_S}
    }

    # Explicit OIP-only peers (plain KServe / CIS). Empty = use federation.peers.
    oip {
      peers = []
      peers = ${?HSENGINE_OIP_PEERS}
      timeout_s = 120
      timeout_s = ${?HSENGINE_OIP_TIMEOUT_S}
    }

    lineage {
      atlas_url = "http://127.0.0.1:21010/api/v1/lineage"
      atlas_url = ${?SIGNALS_ATLAS_OL_URL}
    }
  }

  # Product surfaces advertised in Engine/Status.surfaces (signals-protocol
  # surfaces.md). Never loopback. Default is the lab lattice host siblings use.
  dashboard {
    http {
      base_url = "http://127.0.0.1:9119"
      base_url = ${?HERMES_DASHBOARD_URL}
      bind_host = "0.0.0.0"
      bind_host = ${?HERMES_DASHBOARD_BIND_HOST}
      bind_port = 9119
      bind_port = ${?HERMES_DASHBOARD_PORT}
      health_path = "/api/health"
      advertise_host = "tinybox.dev.vista.zndx.org"
      advertise_host = ${?HERMES_ADVERTISE_HOST}
      primary_ui = ""
      primary_ui = ${?HERMES_PRIMARY_UI}
    }
  }

  gateway {
    http {
      base_url = "http://127.0.0.1:8642"
      base_url = ${?HERMES_GATEWAY_URL}
      bind_port = 8642
      bind_port = ${?HERMES_GATEWAY_PORT}
      health_path = "/health"
    }
  }
}
