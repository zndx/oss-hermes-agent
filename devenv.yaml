# yaml-language-server: $schema=https://devenv.sh/devenv.schema.json
inputs:
  nixpkgs:
    url: github:cachix/devenv-nixpkgs/rolling
  # devenv services.rustfs pulls this input. Pin matches Signals/synth
  # (99701e9) rather than floating HEAD.
  rustfs:
    url: github:rustfs/rustfs/99701e9f52eaafecccd73b3a2a35bf66423dd4f9

# Secrets: DECLARED in secretspec.toml, PROVIDED per environment.
# dotenv (.env) is the local default (gitignored).
secretspec:
  enable: true
  provider: dotenv
  profile: default


# If you're using non-OSS software, you can set allowUnfree to true.
# allowUnfree: true

# If you're willing to use a package that's vulnerable
# permittedInsecurePackages:
#  - "openssl-1.1.1w"

# If you have more than one devenv you can merge them
#imports:
# - ./backend
