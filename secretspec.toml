# Declared secrets — values never live here (https://secretspec.dev/).
# dotenv (.env) is the local provider (gitignored).
#
#   secretspec set HERMES_DASHBOARD_BASIC_AUTH_PASSWORD
#   secretspec set HERMES_DASHBOARD_BASIC_AUTH_SECRET

[project]
name = "hermes-agent"
revision = "1.0"

[profiles.default]
HERMES_DASHBOARD_BASIC_AUTH_USERNAME = { description = "Dashboard login username (non-loopback bind)", required = false }
HERMES_DASHBOARD_BASIC_AUTH_PASSWORD = { description = "Dashboard login password (plaintext; hashed in-process). Required to start processes.dashboard.", required = false }
HERMES_DASHBOARD_BASIC_AUTH_SECRET = { description = "HMAC secret for dashboard sessions (base64 or hex, ≥16 bytes)", required = false }
RUSTFS_ACCESS_KEY = { description = "Hermes RustFS S3 access key (lab default rustfsadmin)", required = false }
RUSTFS_SECRET_KEY = { description = "Hermes RustFS S3 secret key (lab default rustfsadmin)", required = false }
